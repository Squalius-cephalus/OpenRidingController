<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gamepad Mapper</title>
</head>

<body>

<h2>Profiles</h2>

<select id="profileSelect" onchange="loadProfile()"></select><br><br>

<input id="profileName" placeholder="Profile name"><br>
<input id="profileColor" placeholder="Color r,g,b"><br><br>

<button onclick="addProfile()">Add Profile</button>
<button onclick="saveProfile()">Save</button>
<button onclick="downloadJSON()">Download JSON</button>
<input type="file" onchange="importJSON(event)">

<hr>

<h2>Buttons</h2>
<div id="buttons"></div>

<script>
let data = {
  activeProfile: "default",
  profiles: {
    default: {
      name: "Default",
      color: [255, 255, 255],
      buttons: {}
    }
  }
};

const buttons = [
  "RightTrigger",
  "LeftTrigger",
  "RightBumper",
  "LeftBumper",
  "Start"
];

function ensureButtons(profile) {
  buttons.forEach(b => {
    if (!profile.buttons[b]) {
      profile.buttons[b] = [{
        type: "keyboard",
        keycode: "",
        action: "tap",
        variable: {}
      }];
    }
  });
}

function renderProfiles() {
  const sel = document.getElementById("profileSelect");
  sel.innerHTML = "";

  for (let p in data.profiles) {
    let opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    if (p === data.activeProfile) opt.selected = true;
    sel.appendChild(opt);
  }

  loadProfile();
}

function loadProfile() {
  let name = document.getElementById("profileSelect").value;
  data.activeProfile = name;

  let profile = data.profiles[name];
  ensureButtons(profile);

  document.getElementById("profileName").value = profile.name;
  document.getElementById("profileColor").value = profile.color.join(",");

  renderButtons();
}

function renderButtons() {
  let profile = data.profiles[data.activeProfile];
  let div = document.getElementById("buttons");
  div.innerHTML = "";

  buttons.forEach(b => {
    let m = profile.buttons[b][0];

    let html = `
      <h3>${b}</h3>

      <select onchange="setVal('${b}','type',this.value)">
        <option ${m.type==="keyboard"?"selected":""}>keyboard</option>
        <option ${m.type==="gamepad"?"selected":""}>gamepad</option>
        <option ${m.type==="analog"?"selected":""}>analog</option>
        <option ${m.type==="mouse"?"selected":""}>mouse</option>
      </select><br>

      <input value="${m.keycode}"
        placeholder="keycode"
        onchange="setVal('${b}','keycode',this.value)"><br>

      <select onchange="setVal('${b}','action',this.value)">
        <option ${m.action==="tap"?"selected":""}>tap</option>
        <option ${m.action==="hold"?"selected":""}>hold</option>
        <option ${m.action==="toggle"?"selected":""}>toggle</option>
      </select><br>
    `;

    if (m.action === "hold") {
      html += `
        <input placeholder="time"
          value="${m.variable.time || ""}"
          onchange="setVar('${b}','time',this.value)"><br>
      `;
    }

    if (m.type === "analog" || m.type === "mouse") {
      html += `
        <input placeholder="analog"
          value="${m.variable.analog || ""}"
          onchange="setVar('${b}','analog',this.value)"><br>
      `;
    }

    div.innerHTML += html;
  });
}

function setVal(btn, field, value) {
  data.profiles[data.activeProfile].buttons[btn][0][field] = value;
  renderButtons();
}

function setVar(btn, field, value) {
  data.profiles[data.activeProfile].buttons[btn][0].variable[field] = value;
}

function addProfile() {
  let name = prompt("Profile name");
  if (!name) return;

  data.profiles[name] = {
    name,
    color: [255, 255, 255],
    buttons: {}
  };

  renderProfiles();
}

function saveProfile() {
  let p = data.profiles[data.activeProfile];

  p.name = document.getElementById("profileName").value;
  p.color = document.getElementById("profileColor").value.split(",").map(x => parseInt(x));

  alert("Saved");
}

function downloadJSON() {
  let blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  let url = URL.createObjectURL(blob);
  window.open(url);
}

function importJSON(e) {
  let r = new FileReader();
  r.onload = ev => {
    data = JSON.parse(ev.target.result);
    renderProfiles();
  };
  r.readAsText(e.target.files[0]);
}

renderProfiles();
</script>

</body>
</html>
